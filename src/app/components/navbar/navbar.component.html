<header class="nav" [class.nav--scrolled]="scrolled()">
  <a class="nav__brand" href="#hero">
    <span class="nav__brand-mark">KK</span>
    <span class="nav__brand-text">Ketaki Kadam</span>
  </a>

  <nav class="nav__links">
    @for (link of links; track link.id) {
      <a
        class="nav__link"
        [class.nav__link--active]="active() === link.id"
        [href]="'#' + link.id"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <a class="btn btn--ghost nav__cta" href="#contact">Let's talk</a>

  <button
    class="nav__toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation menu"
  >
    <span></span><span></span><span></span>
  </button>

  @if (menuOpen()) {
    <nav class="nav__mobile" (click)="closeMenu()">
      @for (link of links; track link.id) {
        <a class="nav__mobile-link" [href]="'#' + link.id">{{ link.label }}</a>
      }
    </nav>
  }
</header>
